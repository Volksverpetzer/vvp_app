overrides:
  react-test-renderer: 19.2.3 # must match react version; @testing-library/react-native enforces exact match at runtime

allowBuilds:
  dtrace-provider: true # required by eas-cli; pnpm v11 blocks its build scripts otherwise
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
nodeLinker: hoisted # see https://pnpm.io/settings#nodelinker
packages:
  - .
patchedDependencies:
  react-native-reanimated-carousel@5.0.0: patches/react-native-reanimated-carousel@5.0.0.patch
minimumReleaseAgeExclude:
  - "@expo/cli@57.0.12"
  - "@expo/router-server@57.0.5"
  - expo-constants@57.0.9
  - expo-modules-core@57.0.9
  - expo@57.0.10
  - "@expo/ui@57.0.9"
  - expo-image@57.0.2
  - expo-linking@57.0.5
  - expo-router@57.0.10
  - expo-updates@57.0.12
