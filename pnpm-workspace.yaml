overrides:
  "expo-atlas>expo-server": 58.1.0 # expo-atlas 0.5.0 still asks for ^57; keep it on the SDK 58 copy (same adapter/http API), bump together with expo
  "zod@^4": 4.6.7 # GHSA memory exhaustion < 4.6.6; dev-only via eslint-plugin-react-hooks, drop once it ships a fixed zod
  react-test-renderer: 19.3.0 # must match react version; @testing-library/react-native enforces exact match at runtime
allowBuilds:
  dtrace-provider: true # required by eas-cli; pnpm v11 blocks its build scripts otherwise
  "@parcel/watcher": false # pulled in by jest-haste-map 30; prebuilt binary ships via optional deps, install script only builds from source
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
nodeLinker: hoisted # see https://pnpm.io/settings#nodelinker
packages:
  - .
patchedDependencies:
  react-native-modal@14.0.0-rc.1: patches/react-native-modal@14.0.0-rc.1.patch
minimumReleaseAgeExclude:
  - "@expo/cli@58.1.20"
  - "@expo/config-plugins@58.0.13"
  - "@expo/config@58.0.12"
  - "@expo/env@2.6.0"
  - "@expo/fingerprint@0.21.10"
  - "@expo/image-utils@0.12.7"
  - "@expo/inline-modules@0.2.10"
  - "@expo/local-build-cache-provider@58.0.12"
  - "@expo/metro-config@58.0.22"
  - "@expo/metro-file-map@58.0.6"
  - "@expo/plist@0.10.2"
  - "@expo/prebuild-config@58.0.20"
  - "@expo/require-utils@58.0.6"
  - "@expo/router-server@58.0.22"
  - babel-preset-expo@58.0.25
  - expo-asset@58.0.21
  - expo-constants@58.0.16
  - expo-font@58.0.12
  - expo-keep-awake@58.0.4
