overrides:
  react-test-renderer: 19.2.3 # must match react version; @testing-library/react-native enforces exact match at runtime

allowBuilds:
  dtrace-provider: true # required by eas-cli; pnpm v11 blocks its build scripts otherwise
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
nodeLinker: hoisted # see https://pnpm.io/settings#nodelinker
packages:
  - .
minimumReleaseAgeExclude:
  - "@expo/cli@57.0.3"
  - "@expo/fingerprint@0.20.1"
  - "@expo/inline-modules@0.1.1"
  - "@expo/local-build-cache-provider@57.0.1"
  - "@expo/metro-config@57.0.2"
  - "@expo/prebuild-config@57.0.3"
  - "@expo/router-server@57.0.1"
  - babel-preset-expo@57.0.1
  - expo-asset@57.0.2
  - expo-constants@57.0.2
  - expo-modules-autolinking@57.0.3
  - expo-modules-core@57.0.1
  - expo@57.0.1
  - "@expo/metro-runtime@57.0.2"
  - expo-dev-client@57.0.3 || 57.0.4
  - expo-dev-launcher@57.0.3 || 57.0.4
  - expo-dev-menu@57.0.3 || 57.0.4
  - expo-linking@57.0.1
  - expo-notifications@57.0.2
  - expo-router@57.0.2
  - expo-splash-screen@57.0.1
  - expo-updates@57.0.4 || 57.0.5
  - expo-build-properties@57.0.2
