overrides:
  react-test-renderer: 19.2.3 # must match react version; @testing-library/react-native enforces exact match at runtime

allowBuilds:
  dtrace-provider: true # required by eas-cli; pnpm v11 blocks its build scripts otherwise
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
nodeLinker: hoisted # see https://pnpm.io/settings#nodelinker
packages:
  - .
patchedDependencies:
  react-native-reanimated-carousel@5.1.1: patches/react-native-reanimated-carousel@5.1.1.patch
minimumReleaseAgeExclude:
  - "@expo/cli@57.0.22"
  - expo-modules-core@57.0.16
  - expo-modules-jsi@57.0.8
  - expo@57.0.20
  - "@expo/ui@57.0.16"
  - expo-notifications@57.0.17
  - expo-router@57.0.19
  - expo-sharing@57.0.18
  - expo-build-properties@57.0.17
