overrides:
  "expo-atlas>expo-server": 58.1.0 # expo-atlas 0.5.0 still asks for ^57; keep it on the SDK 58 copy (same adapter/http API), bump together with expo
  "zod@^4": 4.6.7 # GHSA memory exhaustion < 4.6.6; dev-only via eslint-plugin-react-hooks, drop once it ships a fixed zod
  react-test-renderer: 19.3.0 # must match react version; @testing-library/react-native enforces exact match at runtime
allowBuilds:
  dtrace-provider: true # required by eas-cli; pnpm v11 blocks its build scripts otherwise
  "@parcel/watcher": false # pulled in by jest-haste-map 30; prebuilt binary ships via optional deps, install script only builds from source
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
nodeLinker: hoisted # see https://pnpm.io/settings#nodelinker
packages:
  - .
minimumReleaseAgeExclude:
  - "@expo/cli@58.1.21"
  - "@expo/metro-config@58.0.23"
  - "@expo/router-server@58.0.23"
  - "@noxcturnal/noxcturnal-darwin-arm64@0.1.14"
  - "@noxcturnal/noxcturnal-darwin-x64@0.1.14"
  - "@noxcturnal/noxcturnal-linux-arm64-gnu@0.1.14"
  - "@noxcturnal/noxcturnal-linux-arm64-musl@0.1.14"
  - "@noxcturnal/noxcturnal-linux-x64-gnu@0.1.14"
  - "@noxcturnal/noxcturnal-linux-x64-musl@0.1.14"
  - "@noxcturnal/noxcturnal-win32-arm64-msvc@0.1.14"
  - "@noxcturnal/noxcturnal-win32-x64-msvc@0.1.14"
  - babel-preset-expo@58.0.26
  - expo-dev-client@58.0.21
  - expo-dev-launcher@58.0.21
  - expo-file-system@58.0.14
  - expo-router@58.0.32
  - expo-web-browser@58.1.0
  - expo@58.0.26
  - jest-expo@58.0.15
  - noxcturnal@0.1.14
