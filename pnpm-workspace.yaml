overrides:
  react-test-renderer: 19.2.3 # must match react version; @testing-library/react-native enforces exact match at runtime

allowBuilds:
  dtrace-provider: true # required by eas-cli; pnpm v11 blocks its build scripts otherwise
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
nodeLinker: hoisted # see https://pnpm.io/settings#nodelinker
packages:
  - .
patchedDependencies:
  react-native-reanimated-carousel@5.1.0: patches/react-native-reanimated-carousel@5.1.0.patch
minimumReleaseAgeExclude:
  - "@expo/cli@57.0.13"
  - "@expo/config-plugins@57.0.7"
  - babel-preset-expo@57.0.6
  - expo-asset@57.0.9
  - expo-file-system@57.0.2
  - expo-modules-core@57.0.10
  - expo@57.0.11
  - expo-notifications@57.0.9
  - expo-router@57.0.11
  - expo-sharing@57.0.10
  - expo-symbols@57.0.2
  - expo-build-properties@57.0.9
