overrides:
  react-test-renderer: 19.2.3 # must match react version; @testing-library/react-native enforces exact match at runtime

allowBuilds:
  dtrace-provider: true # required by eas-cli; pnpm v11 blocks its build scripts otherwise
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
nodeLinker: hoisted # see https://pnpm.io/settings#nodelinker
packages:
  - .
patchedDependencies:
  react-native-reanimated-carousel@5.1.1: patches/react-native-reanimated-carousel@5.1.1.patch
minimumReleaseAgeExclude:
  - "@expo/cli@57.0.14"
  - "@expo/fingerprint@0.20.7"
  - "@expo/inline-modules@0.1.5"
  - "@expo/local-build-cache-provider@57.0.6"
  - "@expo/metro-config@57.0.8"
  - "@expo/prebuild-config@57.0.11"
  - expo-asset@57.0.10
  - expo-constants@57.0.10
  - expo-server@57.0.2
  - expo@57.0.12
  - "@expo/metro-runtime@57.0.9"
  - "@expo/ui@57.0.10"
  - expo-dev-client@57.0.11
  - expo-dev-launcher@57.0.11
  - expo-dev-menu@57.0.11
  - expo-notifications@57.0.10
  - expo-router@57.0.12
  - expo-sharing@57.0.11
  - expo-splash-screen@57.0.6
  - expo-updates@57.0.13
  - expo-build-properties@57.0.10
  - jest-expo@57.0.4
