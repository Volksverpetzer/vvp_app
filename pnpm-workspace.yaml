overrides:
  react-test-renderer: 19.2.3 # must match react version; @testing-library/react-native enforces exact match at runtime

allowBuilds:
  dtrace-provider: true # required by eas-cli; pnpm v11 blocks its build scripts otherwise
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
nodeLinker: hoisted # see https://pnpm.io/settings#nodelinker
packages:
  - .
patchedDependencies:
  react-native-reanimated-carousel@5.1.1: patches/react-native-reanimated-carousel@5.1.1.patch
minimumReleaseAgeExclude:
  - "@atproto/api@0.20.41"
  - "@expo/cli@57.0.15"
  - "@expo/config-plugins@57.0.8"
  - "@expo/metro-runtime@57.0.10"
  - "@expo/prebuild-config@57.0.12"
  - "@expo/router-server@57.0.6"
  - "@expo/ui@57.0.11"
  - "@volksverpetzer/design-tokens@0.4.0"
  - babel-preset-expo@57.0.7
  - expo-asset@57.0.11
  - expo-build-properties@57.0.11
  - expo-constants@57.0.11
  - expo-dev-client@57.0.12
  - expo-dev-launcher@57.0.12
  - expo-dev-menu@57.0.12
  - expo-file-system@57.0.4
  - expo-image@57.0.3
  - expo-linking@57.0.6
  - expo-modules-autolinking@57.0.10
  - expo-modules-core@57.0.11
  - expo-notifications@57.0.11
  - expo-router@57.0.13
  - expo-server@57.0.3
  - expo-sharing@57.0.12
  - expo-updates@57.0.14
  - expo@57.0.13
