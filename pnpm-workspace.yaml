overrides:
  react-test-renderer: 19.2.3 # must match react version; @testing-library/react-native enforces exact match at runtime

allowBuilds:
  dtrace-provider: true # required by eas-cli; pnpm v11 blocks its build scripts otherwise
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
nodeLinker: hoisted # see https://pnpm.io/settings#nodelinker
packages:
  - .
minimumReleaseAgeExclude:
  - expo-dev-client@57.0.4 || 57.0.5
  - expo-dev-launcher@57.0.4 || 57.0.5
  - expo-dev-menu@57.0.4 || 57.0.5
  - expo-updates@57.0.5 || 57.0.6
  - "@expo/cli@57.0.4"
  - "@expo/config-plugins@57.0.2"
  - "@expo/config@57.0.2"
  - "@expo/env@2.4.1"
  - "@expo/fingerprint@0.20.2"
  - "@expo/image-utils@0.11.1"
  - "@expo/local-build-cache-provider@57.0.2"
  - "@expo/metro-config@57.0.3"
  - "@expo/prebuild-config@57.0.4"
  - "@expo/require-utils@57.0.1"
  - "@expo/schema-utils@57.0.1"
  - expo-asset@57.0.3
  - expo-constants@57.0.3
  - expo-modules-autolinking@57.0.4
  - expo-modules-core@57.0.2
  - expo@57.0.2
  - "@expo/metro-runtime@57.0.3"
  - "@expo/ui@57.0.3"
  - expo-notifications@57.0.3
  - expo-router@57.0.3
  - expo-sharing@57.0.2
  - expo-splash-screen@57.0.2
  - expo-build-properties@57.0.3
  - jest-expo@57.0.1
