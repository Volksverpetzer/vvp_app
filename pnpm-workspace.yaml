overrides:
  react-test-renderer: 19.2.3 # must match react version; @testing-library/react-native enforces exact match at runtime

allowBuilds:
  dtrace-provider: true # required by eas-cli; pnpm v11 blocks its build scripts otherwise
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
nodeLinker: hoisted # see https://pnpm.io/settings#nodelinker
packages:
  - .
minimumReleaseAgeExclude:
  - "@expo/cli@57.0.9"
  - "@expo/metro-config@57.0.6"
  - "@expo/prebuild-config@57.0.8"
  - expo-asset@57.0.6
  - expo-constants@57.0.6
  - expo-modules-autolinking@57.0.8
  - expo-modules-core@57.0.6
  - expo@57.0.7
  - "@expo/metro-runtime@57.0.6"
  - "@expo/ui@57.0.7"
  - expo-application@57.0.2
  - expo-dev-client@57.0.7
  - expo-dev-launcher@57.0.7
  - expo-dev-menu@57.0.7
  - expo-notifications@57.0.6
  - expo-router@57.0.7
  - expo-sharing@57.0.6
  - expo-updates@57.0.8
  - expo-build-properties@57.0.6
