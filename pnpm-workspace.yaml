overrides:
  react-test-renderer: 19.2.3 # must match react version; @testing-library/react-native enforces exact match at runtime

allowBuilds:
  dtrace-provider: true # required by eas-cli; pnpm v11 blocks its build scripts otherwise
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
nodeLinker: hoisted # see https://pnpm.io/settings#nodelinker
packages:
  - .
patchedDependencies:
  react-native-reanimated-carousel@5.1.1: patches/react-native-reanimated-carousel@5.1.1.patch
minimumReleaseAgeExclude:
  - "@expo/cli@57.0.22"
  - expo-modules-core@57.0.16
  - expo-modules-jsi@57.0.8
  - expo@57.0.20
  - "@expo/ui@57.0.16"
  - expo-notifications@57.0.17
  - expo-router@57.0.19
  - expo-sharing@57.0.18
  - expo-build-properties@57.0.17
  - "@cspell/cspell-bundled-dicts@10.2.2"
  - "@cspell/cspell-json-reporter@10.2.2"
  - "@cspell/cspell-performance-monitor@10.2.2"
  - "@cspell/cspell-pipe@10.2.2"
  - "@cspell/cspell-resolver@10.2.2"
  - "@cspell/cspell-service-bus@10.2.2"
  - "@cspell/cspell-types@10.2.2"
  - "@cspell/cspell-worker@10.2.2"
  - "@cspell/dynamic-import@10.2.2"
  - "@cspell/eslint-plugin@10.2.2"
  - "@cspell/filetypes@10.2.2"
  - "@cspell/rpc@10.2.2"
  - "@cspell/strong-weak-map@10.2.2"
  - "@cspell/url@10.2.2"
  - cspell-config-lib@10.2.2
  - cspell-dictionary@10.2.2
  - cspell-gitignore@10.2.2
  - cspell-glob@10.2.2
  - cspell-grammar@10.2.2
  - cspell-io@10.2.2
  - cspell-lib@10.2.2
  - cspell-trie-lib@10.2.2
  - cspell@10.2.2
  - lint-staged@17.5.0
