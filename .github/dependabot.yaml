version: 2
updates:
  - package-ecosystem: github-actions
    # "/" only covers .github/workflows; the composite actions under
    # .github/actions need their own entry or their pins never get updated
    directories:
      - /
      - /.github/actions/*
    commit-message:
      prefix: chore
      prefix-development: chore
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    commit-message:
      prefix: chore
      prefix-development: chore
    schedule:
      interval: daily
    cooldown:
      default-days: 1
