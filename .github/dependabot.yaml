version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: chore
      prefix-development: chore
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    commit-message:
      prefix: chore
      prefix-development: chore
    schedule:
      interval: daily
    cooldown:
      default-days: 1
