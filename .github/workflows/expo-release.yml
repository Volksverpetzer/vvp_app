name: Expo Release

on:
  push:
    branches:
      - "main"
    tags:
      - "v*.*.*" # Match tags like v1.2.3, v2.3.0, etc.

jobs:
  test-and-lint:
    name: 🧪 Test and Lint
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-slim
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🏗 Setup environment
        uses: ./.github/actions/setup-node-pnpm-expo
        with:
          setup-node: "false"

      - name: 🏃‍♀️ Run composite test-and-lint
        uses: ./.github/actions/test-and-lint

  build-and-release-stores:
    name: 🚀 Build and Release to Stores
    needs: test-and-lint
    runs-on: ubuntu-slim
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🏗 Setup environment
        uses: ./.github/actions/setup-node-pnpm-expo
        with:
          setup-expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: 🚀 EAS Build - android
        run: APP=volksverpetzer eas build --platform android --clear-cache --non-interactive --auto-submit --no-wait

      - name: 🚀 EAS Build - ios
        run: APP=volksverpetzer eas build --platform ios --clear-cache --non-interactive --auto-submit --no-wait

  push-play-metadata:
    name: 📝 Push Google Play Metadata
    needs: build-and-release-stores
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 🏗 Setup environment
        uses: ./.github/actions/setup-node-pnpm-expo
        with:
          install-deps: "false"
          setup-expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: ⏳ Wait for EAS android build
        id: android-build
        run: node scripts/wait-for-eas-build.mjs --platform android --commit ${{ github.sha }}

      - name: 🛠 Prepare Play metadata
        run: node scripts/prepare-play-metadata.mjs --play-version-code ${{ steps.android-build.outputs.build-version }}

      - name: 💎 Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: 🔑 Write Play service account key
        run: printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-key.json"
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

      - name: 🚀 Push metadata to Google Play
        run: bundle exec fastlane android push_metadata version_code:${{ steps.android-build.outputs.build-version }}
        env:
          PLAY_JSON_KEY_FILE: ${{ runner.temp }}/play-key.json

  push-appstore-metadata:
    name: 📝 Push App Store Metadata
    needs: build-and-release-stores
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 🏗 Setup environment
        uses: ./.github/actions/setup-node-pnpm-expo
        with:
          install-deps: "false"
          setup-expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: ⏳ Wait for EAS ios build
        run: node scripts/wait-for-eas-build.mjs --platform ios --commit ${{ github.sha }}

      # auto-submit runs asynchronously after the build — give it time to
      # deliver the build so the release notes land on the new version
      - name: ⏳ Wait for auto-submit
        run: sleep 300

      - name: 🛠 Generate store.config.json
        run: node scripts/prepare-store-config.mjs

      - name: 🚀 Push metadata to App Store
        run: APP=volksverpetzer eas metadata:push --profile production --non-interactive

  build-and-release-apk:
    name: 🎂 Build and Release APK
    needs: build-and-release-stores
    runs-on: ubuntu-latest
    env:
      APK_NAME: vvp-app-${{ github.ref_name }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🏗 Setup environment
        uses: ./.github/actions/setup-node-pnpm-expo
        with:
          setup-expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: 🚀 EAS Build - android apk
        run: eas build --profile local-apk --platform android --local --output ${{ github.workspace }}/build/${{ env.APK_NAME }}.apk

      - name: 🛠 Prepare F-Droid build
        run: pnpm prepare:fdroid

      - name: 🚀 EAS Build - android apk (FOSS)
        run: eas build --profile fdroid --platform android --local --output ${{ github.workspace }}/build/${{ env.APK_NAME }}-foss.tar.gz

      - name: 📦 Extract FOSS per-ABI APKs
        working-directory: ${{ github.workspace }}/build
        run: |
          tar -xzvf "${APK_NAME}-foss.tar.gz"
          mv release/app-arm64-v8a-release.apk "${APK_NAME}-foss-arm64-v8a.apk"
          mv release/app-armeabi-v7a-release.apk "${APK_NAME}-foss-armeabi-v7a.apk"

      - name: 🎂 Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ github.workspace }}/build/${{ env.APK_NAME }}.apk
            ${{ github.workspace }}/build/${{ env.APK_NAME }}-foss-arm64-v8a.apk
            ${{ github.workspace }}/build/${{ env.APK_NAME }}-foss-armeabi-v7a.apk
