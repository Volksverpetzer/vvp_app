name: Check Test and Lint

on:
  push:
    branches:
      - "**"

jobs:
  check-test-and-lint:
    name: 🧪 Check, Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🏗 Setup environment
        uses: ./.github/actions/setup-node-pnpm-expo
        with:
          setup-node: "true"

      - name: ✅ Check code
        run: pnpm check
        shell: bash

      - name: 🩺 Expo doctor
        # main only ever receives already-checked commits from prerelease (or a
        # release-prep PR that was itself checked before merging); re-running
        # here just risks a false-negative if Expo ships a patch in the gap
        # between the prerelease check and the main merge.
        if: github.ref_name != 'main'
        run: pnpm expo:doctor
        shell: bash

      - name: 🔍 Check fastlane supply metadata
        uses: ashutoshgngwr/validate-fastlane-supply-metadata@v2

      - name: 🔍 Check for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: 🏃‍♀️ Run tests and linter
        uses: ./.github/actions/test-and-lint
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
