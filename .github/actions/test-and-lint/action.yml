name: Test and Lint
description: Composite action to run lint and tests
inputs:
  codecov-token:
    description: Codecov upload token
    required: false
runs:
  using: composite
  steps:
    - name: 🔍 Run lint
      run: pnpm lint
      shell: bash

    # Jest babel-transforms all of node_modules (transformIgnorePatterns: []),
    # so a cold cache makes the first test file take minutes on its own.
    - name: 💾 Restore Jest transform cache
      uses: actions/cache@v6
      with:
        path: node_modules/.cache/jest
        key: jest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'babel.config.cts', 'jest.config.ts') }}
        restore-keys: jest-${{ runner.os }}-

    - name: ✅ Run tests
      run: pnpm test --silent --cacheDirectory=node_modules/.cache/jest
      shell: bash

    - name: 📊 Upload coverage to Codecov
      if: ${{ inputs.codecov-token != '' }}
      uses: codecov/codecov-action@v5
      with:
        token: ${{ inputs.codecov-token }}
        files: ./coverage/coverage-final.json
        fail_ci_if_error: false
